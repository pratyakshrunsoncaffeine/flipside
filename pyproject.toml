[project]
name = "flipside"
version = "0.1.0"
description = "Seal a coding-agent session into a PR and verify quotes from it over Switch"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
flip = "flipside.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["flipside*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["flipside", "tests", "examples", "fixtures", "docs/seal/example.py", "demo"]
