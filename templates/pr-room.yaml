# One room per AI-written PR. Created by the author's gate agent through the
# `create_room_from_yaml` operation, so {$creator} is the agent's owner: the PR author.
# The human reviewer is not in the room; the gate pages them once it clears.
params:
  slug:
    type: string
    description: Room name, e.g. pr-acme-shop-7
  title:
    type: string
    description: The PR key and title
  gate_agent:
    type: agent
    description: The author's gate agent (addressing policy owner)
room:
  name: "{slug}"
  description: "Ownership Gate for {title}"
  channel_type: channel_private
  agents: ["{gate_agent}"]
  users: ["{$creator}"]
  instructions: |
    This room holds {title} until its author has answered for it.
    {gate_agent} posts the gaps it found between the PR description, the author's
    own agent session and CI, as numbered questions.
    Only {$creator} answers, in their own words, as `1: ...`, `2: ...`.
    Every answer and every revision stays in this room.
    Agents in this room never answer for {$creator}.
