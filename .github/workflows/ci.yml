name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install dev tools
        run: uv sync --frozen
      - name: Lint
        run: make lint
      - name: Test
        run: make test
      - name: G8 offline verify
        run: make g8
      - name: Offline replay and fixtures
        run: |
          make replay-offline
          make fixtures
