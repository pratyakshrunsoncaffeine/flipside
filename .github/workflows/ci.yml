name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Ubuntu and Windows must pass (Windows green on every PR since #7; the README has a Windows path).
# macOS runs on pushes to main only: GitHub cancels PR jobs when no macOS runner is free,
# and every PR is also checked on macOS locally.
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ github.event_name == 'push' && fromJSON('["ubuntu-latest", "windows-latest", "macos-latest"]') || fromJSON('["ubuntu-latest", "windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.os == 'macos-latest' }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      FLIP_REQUIRE_NODE: "1"
      FLIP_REQUIRE_CHROME: ${{ matrix.os == 'ubuntu-latest' && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      # Node runs the verify page's script in tests/blind; FLIP_REQUIRE_NODE turns a skip into a failure.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dev tools
        run: uv sync --frozen
      - name: Lint
        run: make lint
      - name: Allow Chrome sandbox namespaces
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Test
        run: make test
        env:
          PYTEST_ADDOPTS: "--durations=8"
          MOBILE_SCREENSHOTS: "1"
      - name: Upload mobile checker screenshots
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: mobile-check-screenshots
          path: mobile-check-screenshots/
          if-no-files-found: warn
      - name: G8 offline verify
        run: make g8
      - name: Offline replay and fixtures
        run: |
          make replay-offline
          make fixtures
      - name: Judge (every README claim, offline)
        run: make judge

  # The whole review on a real Switch 0.31.0 server with Mattermost, in Docker (README Status row
  # for `make demo`). Ubuntu runners ship Docker with Compose v2; demo.py pulls Switch's pinned
  # Compose file from ghcr.io anonymously, so the job needs no secrets.
  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install
        run: uv sync --frozen
      # judge-live runs `flip demo up` and `flip demo run` (what `make demo` runs), then K5,
      # and checks the logs this run wrote.
      - name: make judge-live
        run: make judge-live
      # Only the evidence logs are uploaded; .flipside-demo/ holds this run's generated secrets.
      - name: Upload the demo, K5 and judge logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: demo-mattermost-log
          path: |
            evidence/demo-mattermost-*.log
            evidence/k5-*.log
            evidence/judge-*
          if-no-files-found: warn
      - name: Container state on failure
        if: failure()
        run: docker ps -a --format '{{.Names}} {{.Status}}'
      - name: make demo-down
        if: always()
        run: make demo-down
