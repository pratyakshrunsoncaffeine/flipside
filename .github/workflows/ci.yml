name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Ubuntu and Windows must pass (Windows green on every PR since #7; the README has a Windows path).
# macOS runs on pushes to main only: GitHub cancels PR jobs when no macOS runner is free,
# and every PR is also checked on macOS locally.
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ github.event_name == 'push' && fromJSON('["ubuntu-latest", "windows-latest", "macos-latest"]') || fromJSON('["ubuntu-latest", "windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.os == 'macos-latest' }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      FLIP_REQUIRE_NODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      # Node runs the verify page's script in tests/blind; FLIP_REQUIRE_NODE turns a skip into a failure.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dev tools
        run: uv sync --frozen
      - name: Lint
        run: make lint
      - name: Test
        run: make test
      - name: G8 offline verify
        run: make g8
      - name: Offline replay and fixtures
        run: |
          make replay-offline
          make fixtures
