[project]
name = "ownership-gate"
version = "0.1.0"
description = "A Switch room that holds AI-written PRs until their human author answers for them, checked against the author's own agent session."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.13"]

[project.scripts]
ogate = "ownership_gate.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ownership_gate*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:freezegun --basetemp=.pytest-tmp"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
